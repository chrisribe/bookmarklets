<div id="{{BOOKMARKLET_ID}}">
    <div class="header">
        <h3>📅 Canva Agenda</h3>
        <button class="close-btn" id="{{BOOKMARKLET_ID}}-close-btn">×</button>
    </div>
    <div class="content">
        <div class="status-section">
            <div class="status-label">Status</div>
            <div id="{{BOOKMARKLET_ID}}-status" class="status-value">Ready</div>
        </div>
        <div class="progress-section" id="{{BOOKMARKLET_ID}}-progress-section" style="display:none">
            <div class="progress-bar-bg">
                <div id="{{BOOKMARKLET_ID}}-progress-bar" class="progress-bar-fill" style="width:0%"></div>
            </div>
            <div id="{{BOOKMARKLET_ID}}-progress-text" class="progress-text">0 / 0</div>
        </div>
        <div class="controls">
            <button class="action-btn btn-primary" id="{{BOOKMARKLET_ID}}-run-btn">
                ▶ Run — Position Selected Image
            </button>
            <button class="action-btn btn-secondary" id="{{BOOKMARKLET_ID}}-stop-btn">
                ⏹ Stop
            </button>
        </div>
        <div class="hint">
            ⚠️ First double-click one upload in Canva so it is on the page and selected, then run.
        </div>
    </div>
</div>
